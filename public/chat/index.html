<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AWS Calculator Worker Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        height: 100%;
      }

      :root {
        color-scheme: light;
        --brand-primary: #01d9b0;
        --brand-primary-hover: #00c9a3;
        --brand-secondary: #00a384;
        --brand-secondary-hover: #008f73;
        --brand-ink: #011329;
        --brand-ink-deep: #010e20;
        --brand-ink-soft: #384250;
        --brand-heading: #172640;
        --brand-surface: #f8fafc;
        --brand-surface-muted: #edf3f8;
        --brand-white: #ffffff;
        --brand-danger: #b44b3d;
        --font-display: "Poppins";
        --font-body: "Roboto";
        --radius-button: 12px;
        --radius-card: 20px;
        --radius-section: 24px;
        --radius-panel: 28px;
        --panel-border: rgba(1, 19, 41, 0.08);
        --shadow-card: 0 14px 34px rgba(1, 19, 41, 0.08);
        --shadow-card-hover: 0 18px 46px rgba(1, 19, 41, 0.12);
        --shadow-panel: 0 22px 54px rgba(1, 19, 41, 0.1);
        --shadow-cta: 0 10px 24px rgba(1, 217, 176, 0.24);
        --transition-standard: 220ms cubic-bezier(0.22, 1, 0.36, 1);
        --panel-bg:
          linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(255, 255, 255, 0.9)),
          radial-gradient(54rem 14rem at 94% -8%, rgba(1, 217, 176, 0.12), transparent 68%);
        --card-bg:
          linear-gradient(170deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.96)),
          radial-gradient(42rem 12rem at 92% -32%, rgba(1, 217, 176, 0.08), transparent 67%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        font-family: var(--font-body), "Roboto", sans-serif;
        color: var(--brand-ink-soft);
        overflow: hidden;
        background:
          radial-gradient(84rem 26rem at 11% -12%, rgba(1, 217, 176, 0.09), transparent 58%),
          radial-gradient(72rem 22rem at 88% -14%, rgba(0, 163, 132, 0.09), transparent 62%),
          #f7fbff;
        text-rendering: optimizeLegibility;
        line-height: 1.6;
      }

      .shell {
        width: min(1520px, 100vw);
        height: 100dvh;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 18px;
      }

      .sidebar,
      .workspace {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-panel);
        background: var(--panel-bg);
        box-shadow: var(--shadow-panel);
      }

      .sidebar {
        padding: 18px;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 18px;
      }

      .sidebar-hero {
        position: relative;
        overflow: hidden;
        padding: 18px;
        border-radius: var(--radius-section);
        background: linear-gradient(118deg, rgba(1, 19, 41, 0.96), rgba(1, 19, 41, 0.84) 62%, rgba(1, 217, 176, 0.28));
        box-shadow: 0 24px 48px rgba(1, 19, 41, 0.22);
        display: flex;
        align-items: center;
      }

      .sidebar-hero::after {
        content: "";
        position: absolute;
        inset: auto -8% -65% auto;
        width: 160px;
        height: 160px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(1, 217, 176, 0.34), rgba(1, 217, 176, 0));
        pointer-events: none;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(1, 19, 41, 0.64);
      }

      .eyebrow-inverse {
        color: rgba(255, 255, 255, 0.82);
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      .workspace-head h2,
      .section-heading h3,
      .share-heading h3 {
        font-family: var(--font-display), "Poppins", sans-serif;
        letter-spacing: -0.026em;
      }

      .sidebar-hero .primary {
        position: relative;
        z-index: 1;
        width: 100%;
      }

      .sidebar button,
      .workspace button {
        border-radius: var(--radius-button);
        padding: 0.82rem 1.15rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform var(--transition-standard),
          box-shadow var(--transition-standard),
          border-color var(--transition-standard),
          background-color var(--transition-standard),
          color var(--transition-standard);
      }

      .primary {
        border: 0;
        color: var(--brand-ink);
        background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
        box-shadow: var(--shadow-cta);
      }

      .ghost {
        border: 1px solid rgba(0, 163, 132, 0.22);
        background: rgba(255, 255, 255, 0.88);
        color: var(--brand-secondary);
      }

      .primary:hover,
      .ghost:hover,
      .chat-item:hover {
        transform: translateY(-1px);
      }

      .primary:hover {
        background: linear-gradient(135deg, var(--brand-primary-hover) 0%, var(--brand-secondary-hover) 100%);
        box-shadow: 0 14px 30px rgba(1, 217, 176, 0.28);
      }

      .ghost:hover {
        border-color: rgba(0, 163, 132, 0.34);
        background: rgba(255, 255, 255, 0.97);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
        transform: none;
        box-shadow: none;
      }

      .sections {
        overflow: auto;
        display: grid;
        gap: 16px;
        min-height: 0;
        padding-right: 2px;
      }

      .section {
        display: grid;
        gap: 14px;
      }

      .identity-card,
      .thread-section,
      .share-panel,
      .composer form,
      .message.assistant,
      .message.system {
        border: 1px solid rgba(1, 19, 41, 0.08);
        background: var(--card-bg);
        box-shadow: var(--shadow-card);
      }

      .identity-card,
      .thread-section {
        border-radius: var(--radius-section);
      }

      .identity-card {
        padding: 16px 18px;
        display: grid;
        gap: 4px;
      }

      .meta-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(1, 19, 41, 0.58);
      }

      .identity-value {
        font-family: var(--font-display), "Poppins", sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1.2;
        color: var(--brand-heading);
        overflow-wrap: anywhere;
      }

      .meta-copy {
        margin: 2px 0 0;
        font-size: 0.95rem;
        color: var(--brand-ink-soft);
      }

      .section-heading {
        display: grid;
        gap: 2px;
      }

      .section-heading h3 {
        font-size: 1.08rem;
        font-weight: 600;
        color: var(--brand-heading);
      }

      .thread-section {
        padding: 18px 18px 14px;
      }

      .chat-list {
        display: grid;
        gap: 10px;
      }

      .chat-item {
        display: grid;
        gap: 6px;
        width: 100%;
        text-align: left;
        border-radius: var(--radius-card);
        padding: 15px 16px;
        border: 1px solid rgba(1, 19, 41, 0.08);
        background: var(--card-bg);
        box-shadow: 0 10px 24px rgba(1, 19, 41, 0.06);
      }

      .chat-item.active {
        border-color: rgba(0, 163, 132, 0.42);
        box-shadow: var(--shadow-card-hover);
      }

      .chat-item .label {
        font-family: var(--font-display), "Poppins", sans-serif;
        font-size: 1.02rem;
        font-weight: 600;
        line-height: 1.22;
        color: var(--brand-heading);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 0.38rem 0.78rem;
        border-radius: 999px;
        border: 1px solid rgba(1, 19, 41, 0.1);
        background: rgba(255, 255, 255, 0.88);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-secondary);
      }

      .badge.owned {
        border-color: rgba(0, 163, 132, 0.14);
        background: rgba(225, 252, 246, 0.9);
      }

      .badge.shared {
        background: rgba(255, 255, 255, 0.92);
      }

      .workspace {
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr) auto;
        overflow: hidden;
        min-height: 0;
      }

      .workspace-head {
        position: relative;
        padding: 22px 28px 18px;
        border-bottom: 1px solid rgba(1, 19, 41, 0.08);
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
        background: var(--card-bg);
      }

      .workspace-head::after {
        content: "";
        position: absolute;
        inset: auto -2% -65% auto;
        width: 220px;
        height: 220px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(1, 217, 176, 0.12), rgba(1, 217, 176, 0));
        pointer-events: none;
      }

      .workspace-head-copy {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 4px;
        max-width: 44rem;
      }

      .workspace-head h2 {
        font-size: clamp(1.6rem, 2.6vw, 2.25rem);
        font-weight: 600;
        line-height: 1.02;
        color: var(--brand-heading);
        text-wrap: balance;
      }

      .workspace-actions {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .identity {
        padding: 16px 28px 12px;
        color: var(--brand-ink-soft);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .permission-pill {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0.52rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(1, 19, 41, 0.1);
        background: rgba(255, 255, 255, 0.86);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-secondary);
      }

      .share-panel {
        margin: 0 28px 20px;
        padding: 18px 20px;
        border-radius: var(--radius-section);
        display: grid;
        gap: 12px;
      }

      .share-heading {
        display: grid;
        gap: 4px;
      }

      .share-heading h3 {
        font-size: 1.04rem;
        font-weight: 600;
        color: var(--brand-heading);
      }

      .share-form {
        display: flex;
        gap: 10px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(1, 19, 41, 0.16);
        border-radius: var(--radius-button);
        padding: 0.82rem 0.92rem;
        font: inherit;
        background: rgba(255, 255, 255, 0.96);
        color: var(--brand-ink);
        transition:
          border-color 140ms ease,
          box-shadow 140ms ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: rgba(56, 66, 80, 0.7);
      }

      input:focus-visible,
      textarea:focus-visible {
        outline: none;
        border-color: rgba(0, 163, 132, 0.7);
        box-shadow: 0 0 0 3px rgba(1, 217, 176, 0.2);
      }

      .acl-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .acl-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0.55rem 0.75rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(1, 19, 41, 0.1);
      }

      .messages {
        overflow: auto;
        padding: 20px 28px 28px;
        display: grid;
        gap: 16px;
        min-height: 0;
        align-content: start;
        background: linear-gradient(180deg, rgba(248, 250, 252, 0.38) 0%, rgba(237, 243, 248, 0.92) 100%);
        border-top: 1px solid rgba(1, 19, 41, 0.08);
        border-bottom: 1px solid rgba(1, 19, 41, 0.08);
      }

      .message {
        animation: riseIn 0.35s ease-out both;
        width: fit-content;
        max-width: min(82%, 760px);
        padding: 16px 18px;
        border-radius: 18px;
        border: 1px solid rgba(1, 19, 41, 0.08);
        white-space: pre-wrap;
        line-height: 1.55;
        overflow-wrap: anywhere;
        box-shadow: 0 10px 24px rgba(1, 19, 41, 0.08);
      }

      .message.user {
        margin-left: auto;
        border-color: rgba(0, 163, 132, 0.2);
        background: linear-gradient(180deg, rgba(225, 252, 246, 0.96), rgba(210, 246, 238, 0.9));
        color: var(--brand-ink);
      }

      .message.assistant {
        color: var(--brand-ink-soft);
      }

      .message.system {
        width: 100%;
        max-width: none;
        background:
          linear-gradient(116deg, rgba(1, 19, 41, 0.96), rgba(1, 19, 41, 0.82) 60%, rgba(1, 217, 176, 0.22)),
          rgba(1, 19, 41, 0.94);
        color: var(--brand-white);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .message.error {
        width: 100%;
        max-width: none;
        background: linear-gradient(180deg, rgba(255, 240, 236, 0.98), rgba(255, 248, 245, 0.96));
        border-color: rgba(180, 75, 61, 0.2);
        color: #7c2b1c;
      }

      .message.pending {
        opacity: 0.72;
      }

      .message-body {
        display: block;
      }

      .message-meta {
        display: block;
        margin-top: 10px;
        font-size: 0.75rem;
        color: rgba(56, 66, 80, 0.7);
      }

      .message.system .message-meta {
        color: rgba(255, 255, 255, 0.66);
      }

      .tool-events {
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }

      .tool-event {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(0, 163, 132, 0.15);
        background: linear-gradient(180deg, rgba(1, 217, 176, 0.1), rgba(1, 217, 176, 0.05));
        color: var(--brand-ink-soft);
        font-size: 14px;
      }

      .composer {
        padding: 18px 28px 28px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0) 100%);
      }

      .composer form {
        border-radius: var(--radius-section);
        padding: 16px;
        display: grid;
        gap: 14px;
      }

      textarea {
        min-height: 124px;
        resize: vertical;
      }

      .composer-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .status {
        font-size: 0.95rem;
        max-width: min(70%, 760px);
      }

      .status.loading {
        color: var(--brand-secondary);
      }

      .status.success {
        color: var(--brand-secondary);
      }

      .status.error {
        color: var(--brand-danger);
        font-weight: 600;
      }

      .meta,
      .empty {
        color: var(--brand-ink-soft);
      }

      .workspace-head .meta {
        color: var(--brand-ink-soft);
      }

      .workspace-head .meta:empty {
        display: none;
      }

      .empty {
        padding: 0.7rem 0;
      }

      .hidden {
        display: none;
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .shell {
          grid-template-columns: 1fr;
          width: 100%;
          min-height: 100dvh;
          height: auto;
          padding: 6px;
        }

        .sidebar,
        .workspace {
          border-radius: 24px;
        }

        .workspace-head,
        .share-form,
        .composer-row,
        .identity {
          flex-direction: column;
          align-items: stretch;
        }

        .workspace-head,
        .identity,
        .messages,
        .composer {
          padding-left: 18px;
          padding-right: 18px;
        }

        .share-panel {
          margin-left: 18px;
          margin-right: 18px;
        }

        .message {
          max-width: 100%;
        }

        .status {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <section class="sidebar-hero">
          <button id="new-chat" class="primary" type="button">New Chat</button>
        </section>

        <section class="identity-card">
          <div class="meta-label">Signed in as</div>
          <div id="identity" class="identity-value">Loading...</div>
        </section>

        <section class="sections">
          <div class="section thread-section">
            <div class="section-heading">
              <h3>Owned</h3>
            </div>
            <div id="owned-chats" class="chat-list">
              <div class="empty">No owned chats yet.</div>
            </div>
          </div>
          <div class="section thread-section">
            <div class="section-heading">
              <h3>Shared With You</h3>
            </div>
            <div id="shared-chats" class="chat-list">
              <div class="empty">No shared chats yet.</div>
            </div>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <header class="workspace-head">
          <div class="workspace-head-copy">
            <h2 id="chat-title">No chat selected</h2>
            <div id="chat-meta" class="meta"></div>
          </div>
          <div class="workspace-actions">
            <button id="fork-chat" class="ghost hidden" type="button">Fork Chat</button>
          </div>
        </header>

        <div class="identity">
          <span id="chat-permission" class="permission-pill hidden"></span>
        </div>

        <section id="share-panel" class="share-panel hidden">
          <div class="share-heading">
            <span class="eyebrow">Access</span>
            <h3>Share this thread</h3>
          </div>
          <div class="share-form">
            <input id="share-email" type="email" placeholder="Share with user@example.com" />
            <button id="share-submit" class="ghost" type="button">Share</button>
          </div>
          <div id="acl-list" class="acl-list" aria-live="polite"></div>
        </section>

        <section id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text">
          <div class="empty">
            Start a conversation.
          </div>
        </section>

        <section class="composer">
          <form id="composer">
            <textarea
              id="prompt"
              placeholder="Example: Create a $25k/month container platform calculator in us-east-1."
            ></textarea>
            <div class="composer-row">
              <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
              <button id="send" class="primary" type="submit">Send</button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script>
      const state = {
        me: null,
        chats: { owned: [], shared: [] },
        activeChat: null,
        sending: false,
        requestSeq: 0,
      };

      const identityNode = document.getElementById("identity");
      const ownedNode = document.getElementById("owned-chats");
      const sharedNode = document.getElementById("shared-chats");
      const titleNode = document.getElementById("chat-title");
      const metaNode = document.getElementById("chat-meta");
      const permissionNode = document.getElementById("chat-permission");
      const messagesNode = document.getElementById("messages");
      const sharePanelNode = document.getElementById("share-panel");
      const aclListNode = document.getElementById("acl-list");
      const statusNode = document.getElementById("status");
      const promptNode = document.getElementById("prompt");
      const sendNode = document.getElementById("send");
      const forkNode = document.getElementById("fork-chat");
      const newChatNode = document.getElementById("new-chat");
      const shareSubmitNode = document.getElementById("share-submit");
      const shareEmailNode = document.getElementById("share-email");

      function setStatus(text, tone = "") {
        statusNode.textContent = text;
        statusNode.className = tone ? `status ${tone}` : "status";
      }

      function setBusy(busy) {
        state.sending = busy;
        sendNode.disabled = busy;
        promptNode.disabled = busy;
        forkNode.disabled = busy;
        newChatNode.disabled = busy;
        shareSubmitNode.disabled = busy;
        [...document.querySelectorAll(".chat-item")].forEach((button) => {
          button.disabled = busy;
        });
      }

      function formatDateTime(value) {
        if (!value) {
          return "";
        }

        const parsed = new Date(value);

        if (Number.isNaN(parsed.getTime())) {
          return value;
        }

        return parsed.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function messageId() {
        return globalThis.crypto?.randomUUID?.() || `msg-${Date.now()}-${Math.random()}`;
      }

      function createLocalMessage(role, text, toolEvents = [], options = {}) {
        return {
          id: messageId(),
          role,
          text,
          toolEvents,
          createdAt: new Date().toISOString(),
          pending: Boolean(options.pending),
          variant: options.variant || "",
        };
      }

      function normalizeChatDetail(payload) {
        return {
          chat: payload.chat,
          aclEmails: Array.isArray(payload.aclEmails) ? payload.aclEmails : [],
          messages: Array.isArray(payload.messages) ? payload.messages : [],
        };
      }

      function currentChatId() {
        return state.activeChat?.chat?.chatId || null;
      }

      function applyTransientAssistantMessage(text, variant = "system") {
        if (!state.activeChat) {
          return;
        }

        state.activeChat = {
          ...state.activeChat,
          messages: [
            ...(state.activeChat.messages || []).filter((message) => !message.pending),
            createLocalMessage("assistant", text, [], { variant }),
          ],
        };
      }

      function buildDraftChat(text) {
        const now = new Date().toISOString();
        return {
          chat: {
            chatId: `draft-${Date.now()}`,
            title: text.trim().slice(0, 120) || "Untitled chat",
            ownerEmail: state.me?.email || "current-user",
            createdAt: now,
            updatedAt: now,
            lastMessageAt: now,
            permission: "owner",
            forkedFromChatId: null,
          },
          aclEmails: [],
          messages: [],
        };
      }

      async function api(path, init = {}) {
        const response = await fetch(path, {
          ...init,
          headers: {
            "content-type": "application/json",
            ...(init.headers || {}),
          },
        });
        const contentType = response.headers.get("content-type") || "";
        let payload = null;

        if (contentType.includes("application/json")) {
          payload = await response.json();
        } else {
          const text = await response.text();
          const normalized = text.trim();

          if (normalized.startsWith("<!DOCTYPE") || normalized.startsWith("<html")) {
            throw new Error(
              response.status === 403
                ? "Your Cloudflare Access session may have expired. Reload the page and sign in again."
                : `The server returned HTML instead of JSON (${response.status}).`,
            );
          }

          throw new Error(
            normalized || `The server returned an unexpected response (${response.status}).`,
          );
        }

        if (!response.ok) {
          throw new Error(payload.error || payload.details || "Request failed.");
        }

        return payload;
      }

      function chatButton(summary) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chat-item";

        if (state.activeChat && state.activeChat.chat.chatId === summary.chatId) {
          button.classList.add("active");
        }

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = summary.title || "Untitled chat";
        const badge = document.createElement("span");
        badge.className = `badge ${summary.permission}`;
        badge.textContent = summary.permission === "owner" ? "Owned" : "Shared";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = formatDateTime(summary.updatedAt || summary.createdAt);
        button.append(label, badge, meta);
        button.disabled = state.sending;
        button.addEventListener("click", async () => {
          if (state.sending) {
            return;
          }

          try {
            setStatus("Loading thread...", "loading");
            await loadChat(summary.chatId);
            setStatus("Ready.", "success");
          } catch (error) {
            setStatus(error.message, "error");
          }
        });
        return button;
      }

      function renderChatLists() {
        function renderInto(node, items, emptyLabel) {
          node.innerHTML = "";

          if (!items.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = emptyLabel;
            node.appendChild(empty);
            return;
          }

          items.forEach((item) => node.appendChild(chatButton(item)));
        }

        renderInto(ownedNode, state.chats.owned, "No owned chats yet.");
        renderInto(sharedNode, state.chats.shared, "No shared chats yet.");
      }

      function appendLinkedText(node, text) {
        const value = String(text || "");
        const pattern = /(https:\/\/calculator\.aws\/#[^\s]+)/g;
        let cursor = 0;

        for (const match of value.matchAll(pattern)) {
          if (match.index > cursor) {
            node.appendChild(document.createTextNode(value.slice(cursor, match.index)));
          }

          const link = document.createElement("a");
          link.href = match[0];
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = match[0];
          node.appendChild(link);
          cursor = match.index + match[0].length;
        }

        if (cursor < value.length) {
          node.appendChild(document.createTextNode(value.slice(cursor)));
        }
      }

      function renderMessages(messages) {
        messagesNode.innerHTML = "";

        if (!messages.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No messages yet.";
          messagesNode.appendChild(empty);
          return;
        }

        messages.forEach((message) => {
          const node = document.createElement("div");
          node.className = `message ${message.role}${message.variant ? ` ${message.variant}` : ""}${message.pending ? " pending" : ""}`;
          const bodyNode = document.createElement("div");
          bodyNode.className = "message-body";
          appendLinkedText(bodyNode, message.text);
          node.appendChild(bodyNode);

          if (Array.isArray(message.toolEvents) && message.toolEvents.length) {
            const toolsNode = document.createElement("div");
            toolsNode.className = "tool-events";

            message.toolEvents.forEach((event) => {
              const eventNode = document.createElement("div");
              eventNode.className = "tool-event";
              eventNode.textContent = `${event.name}: ${event.summary || (event.ok ? "completed" : "failed")}`;
              toolsNode.appendChild(eventNode);
            });

            node.appendChild(toolsNode);
          }

          if (message.createdAt) {
            const meta = document.createElement("span");
            meta.className = "message-meta";
            meta.textContent = new Date(message.createdAt).toLocaleString();
            node.appendChild(meta);
          }

          messagesNode.appendChild(node);
        });

        messagesNode.scrollTop = messagesNode.scrollHeight;
      }

      function renderAcl(aclEmails, isOwner) {
        sharePanelNode.classList.toggle("hidden", !isOwner);
        aclListNode.innerHTML = "";

        if (!isOwner) {
          return;
        }

        if (!aclEmails.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No shared users.";
          aclListNode.appendChild(empty);
          return;
        }

        aclEmails.forEach((email) => {
          const chip = document.createElement("div");
          chip.className = "acl-chip";
          const label = document.createElement("span");
          label.textContent = email;
          chip.appendChild(label);
          const removeButton = document.createElement("button");
          removeButton.className = "ghost";
          removeButton.type = "button";
          removeButton.textContent = "Remove";
          removeButton.disabled = state.sending;
          removeButton.addEventListener("click", async () => {
            if (state.sending) {
              return;
            }

            try {
              setStatus("Updating share access...", "loading");
              await api(`/api/chats/${state.activeChat.chat.chatId}/shares/${encodeURIComponent(email)}`, {
                method: "DELETE",
              });
              await loadChat(state.activeChat.chat.chatId);
              setStatus("Ready.", "success");
            } catch (error) {
              setStatus(error.message, "error");
            }
          });
          chip.appendChild(removeButton);
          aclListNode.appendChild(chip);
        });
      }

      function renderActiveChat() {
        if (!state.activeChat) {
          titleNode.textContent = "No chat selected";
          metaNode.textContent = "";
          permissionNode.textContent = "";
          permissionNode.classList.add("hidden");
          forkNode.classList.add("hidden");
          renderAcl([], false);
          renderMessages([]);
          return;
        }

        const { chat, messages, aclEmails } = state.activeChat;
        const isOwner = chat.permission === "owner";
        titleNode.textContent = chat.title;
        metaNode.textContent = [chat.ownerEmail, formatDateTime(chat.updatedAt)]
          .filter(Boolean)
          .join(" • ");
        permissionNode.textContent = isOwner ? "Owner" : "Read only";
        permissionNode.classList.remove("hidden");
        forkNode.classList.toggle("hidden", isOwner);
        promptNode.disabled = !isOwner || state.sending;
        sendNode.disabled = !isOwner || state.sending;
        forkNode.disabled = state.sending;
        shareSubmitNode.disabled = state.sending;
        promptNode.placeholder = isOwner
          ? "Ask the assistant to create a calculator or continue the analysis."
          : "Fork this thread to continue it.";
        renderAcl(aclEmails || [], isOwner);
        renderMessages(messages);
      }

      async function refreshChats() {
        const selectedChatId = currentChatId();
        state.chats = await api("/api/chats", { method: "GET" });

        if (
          selectedChatId &&
          ![...state.chats.owned, ...state.chats.shared].some((chat) => chat.chatId === selectedChatId)
        ) {
          state.activeChat = null;
        }

        renderChatLists();
      }

      async function loadChat(chatId) {
        state.activeChat = normalizeChatDetail(
          await api(`/api/chats/${chatId}`, { method: "GET" }),
        );
        renderChatLists();
        renderActiveChat();
        return state.activeChat;
      }

      async function createChat(title = "") {
        const payload = await api("/api/chats", {
          method: "POST",
          body: JSON.stringify({ title }),
        });
        state.activeChat = normalizeChatDetail({
          chat: payload.chat,
          messages: [],
          aclEmails: [],
        });
        await refreshChats();
        renderActiveChat();
        return state.activeChat;
      }

      async function sendPrompt(text) {
        const normalizedText = text.trim();
        const requestId = state.requestSeq + 1;
        state.requestSeq = requestId;

        if (!normalizedText) {
          return;
        }

        const hadActiveChat = Boolean(state.activeChat?.chat?.chatId);
        const previousActiveChat = state.activeChat;
        const previousMessages = hadActiveChat ? [...(state.activeChat.messages || [])] : [];
        const userMessage = createLocalMessage("user", normalizedText);
        const pendingMessage = createLocalMessage("assistant", "Working through calculator tools...", [], {
          variant: "system",
          pending: true,
        });

        if (!hadActiveChat) {
          state.activeChat = buildDraftChat(normalizedText);
        }

        state.activeChat = {
          ...state.activeChat,
          messages: [...previousMessages, userMessage, pendingMessage],
        };
        renderActiveChat();
        setBusy(true);
        setStatus("Calling Gemini and tools...", "loading");

        try {
          let payload;

          if (!state.activeChat) {
            return;
          }

          if (requestId !== state.requestSeq) {
            return;
          }

          if (!hadActiveChat) {
            payload = await api("/api/chats", {
              method: "POST",
              body: JSON.stringify({ text: normalizedText }),
            });
          } else {
            payload = await api(`/api/chats/${state.activeChat.chat.chatId}/messages`, {
              method: "POST",
              body: JSON.stringify({ text: normalizedText }),
            });
          }

          state.activeChat = {
            ...state.activeChat,
            chat: payload.chat,
            messages: [
              ...previousMessages,
              userMessage,
              createLocalMessage("assistant", payload.reply || "No response returned.", payload.toolEvents || []),
            ],
          };
          promptNode.value = "";
          renderActiveChat();
          await refreshChats();

          try {
            await loadChat(payload.chat.chatId);
            setStatus("Ready.", "success");
          } catch (error) {
            setStatus(`Reply saved, but thread refresh failed: ${error.message}`, "error");
          }
        } catch (error) {
          if (!hadActiveChat && state.activeChat?.chat?.chatId?.startsWith("draft-")) {
            state.activeChat = previousActiveChat;
          }
          applyTransientAssistantMessage(error.message, "error");
          setStatus(error.message, "error");
        } finally {
          setBusy(false);
          renderActiveChat();
        }
      }

      newChatNode.addEventListener("click", async () => {
        if (state.sending) {
          return;
        }

        try {
          setStatus("Creating chat...", "loading");
          await createChat();
          setStatus("Ready.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      document.getElementById("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        await sendPrompt(promptNode.value);
      });

      shareSubmitNode.addEventListener("click", async () => {
        if (state.sending) {
          return;
        }

        const email = shareEmailNode.value.trim();

        if (!email || !state.activeChat) {
          return;
        }

        try {
          setStatus("Sharing chat...", "loading");
          await api(`/api/chats/${state.activeChat.chat.chatId}/shares`, {
            method: "POST",
            body: JSON.stringify({ email }),
          });
          shareEmailNode.value = "";
          await loadChat(state.activeChat.chat.chatId);
          setStatus("Ready.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      forkNode.addEventListener("click", async () => {
        if (!state.activeChat || state.sending) {
          return;
        }

        try {
          setStatus("Forking thread...", "loading");
          const payload = await api(`/api/chats/${state.activeChat.chat.chatId}/fork`, {
            method: "POST",
            body: JSON.stringify({}),
          });
          await refreshChats();
          await loadChat(payload.chat.chatId);
          setStatus("Ready.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      async function boot() {
        try {
          const me = await api("/api/me", { method: "GET" });
          state.me = me;
          identityNode.textContent = me.email;
          await refreshChats();
          const firstChat = state.chats.owned[0] || state.chats.shared[0];

          if (firstChat) {
            await loadChat(firstChat.chatId);
          } else {
            renderActiveChat();
          }

          setStatus("Ready.", "success");
        } catch (error) {
          identityNode.textContent = "Unavailable";
          setStatus(error.message, "error");
        }
      }

      boot();
    </script>
  </body>
</html>
