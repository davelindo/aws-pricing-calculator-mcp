name = "aws-pricing-calculator-mcp"
main = "src/worker.js"
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "CHAT_COORDINATOR"
class_name = "ChatCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatCoordinator"]
